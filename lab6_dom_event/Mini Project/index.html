<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran Workshop Cybersecurity & Web</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="form-header">
        <h2>Formulir Pendaftaran Workshop</h2>
        <p>Isi data diri Anda di bawah ini untuk mengamankan kursi workshop.</p>
      </header>

      <div id="status-message" class="status-message hidden"></div>

      <form id="registration-form" novalidate>
        <div class="form-group">
          <label for="fullName"
            >Nama Lengkap <span class="required">*</span></label
          >
          <input
            type="text"
            id="fullName"
            placeholder="Contoh: Suyatno"
            autocomplete="off"
          />
          <small class="error-text" id="name-error"></small>
        </div>

        <!-- Input Email -->
        <div class="form-group">
          <label for="email"
            >Alamat Email <span class="required">*</span></label
          >
          <input
            type="email"
            id="email"
            placeholder="nama@email.com"
            autocomplete="off"
          />
          <small class="error-text" id="email-error"></small>
        </div>

        <!-- Pilihan Sesi -->
        <div class="form-group">
          <label for="session"
            >Pilih Sesi Workshop <span class="required">*</span></label
          >
          <select id="session">
            <option value="">-- Pilih Sesi --</option>
            <option value="Sesi 1: Web Security & API Hardening">
              Sesi 1: Web Security & API Hardening
            </option>
            <option value="Sesi 2: Modern Frontend Development">
              Sesi 2: Modern Frontend Development
            </option>
            <option value="Sesi 3: Cloud Infrastructure & Automation">
              Sesi 3: Cloud Infrastructure & Automation
            </option>
          </select>
          <small class="error-text" id="session-error"></small>

          <!-- Box informasi detail sesi yang dipilih (BARU) -->
          <div id="session-detail" class="session-detail-box hidden">
            <h4>Informasi Sesi Terpilih:</h4>
            <p id="session-description"></p>
          </div>
        </div>
        <div class="form-group">
          <label for="notes">Catatan Tambahan / Motivasi (Opsional)</label>
          <textarea
            id="notes"
            maxlength="150"
            rows="4"
            placeholder="Tuliskan ekspektasi atau catatan Anda..."
          ></textarea>
          <div class="char-counter">
            <span id="char-count">0</span> / 150 Karakter
          </div>
        </div>

        <section class="summary-card">
          <h3>Ringkasan Input (Live Preview)</h3>
          <p><strong>Nama:</strong> <span id="preview-name">-</span></p>
          <p><strong>Email:</strong> <span id="preview-email">-</span></p>
          <p>
            <strong>Sesi Terpilih:</strong> <span id="preview-session">-</span>
          </p>
        </section>

        <!-- Action Buttons -->
        <div class="button-group">
          <button type="submit" id="btn-submit" class="btn btn-primary">
            Daftar Sekarang
          </button>
          <button type="reset" id="btn-reset" class="btn btn-secondary">
            Reset / Hapus
          </button>
        </div>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
